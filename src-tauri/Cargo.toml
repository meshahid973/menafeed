[package]
name = "signal-mena"
version = "0.1.0"
description = "SIGNAL / MENA desktop application"
authors = ["SIGNAL contributors"]
edition = "2021"
build = "build.rs"

[lib]
name = "signal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
