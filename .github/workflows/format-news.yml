name: Format news polish
on:
  push:
    branches: [feat/news-polish]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
      - run: npx prettier --write src/features/news/NewsFeed.tsx src/features/news/NewsFeed.css src/features/news/NewsFeed.test.tsx src/components/layout/AppShell.tsx src/components/layout/MapSlot.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style: format newsroom polish"
            git push origin HEAD:feat/news-polish
          fi
