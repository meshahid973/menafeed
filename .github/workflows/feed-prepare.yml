name: Prepare feed branch

on:
  push:
    branches: [feat/editorial-feed]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install formatter
        run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
      - name: Format changed files
        run: |
          npx prettier --write src/app/App.tsx src/app/App.test.tsx src/components/layout/AppShell.tsx src/components/layout/AppShell.css src/components/layout/MapSlot.tsx src/components/layout/MapSlot.css src/features/news/contracts.ts src/features/news/NewsFeed.tsx src/features/news/NewsFeed.css src/features/news/NewsFeed.test.tsx src/features/news/StoryCard.tsx src/features/news/useNewsFeed.ts src/services/news.ts src/services/news.test.ts
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Lock Rust dependencies
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit locks and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri/Cargo.lock src-tauri/src
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock feed dependencies"
            git push origin HEAD:feat/editorial-feed
          fi
