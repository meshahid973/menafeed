name: Prepare sources
on:
  push:
    branches: [feat/source-registry]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          npx prettier --write src/features/news/useNewsFeed.ts src/features/news/contracts.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "style: format provider registry"
            git push origin HEAD:feat/source-registry
          fi
