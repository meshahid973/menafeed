name: Format release reliability
on:
  push:
    branches: [feat/release-reliability]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          npx prettier --write src/features/news/useNewsFeed.ts src/features/news/useNewsFeed.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "style: format release reliability"
            git push origin HEAD:feat/release-reliability
          fi
