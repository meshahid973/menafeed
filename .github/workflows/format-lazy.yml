name: Format lazy controls
on:
  push:
    branches: [feat/news-controls]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install -g npm@11.6.3
          npm ci --no-audit
          npx prettier --write src/features/news/NewsFeed.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/news/NewsFeed.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format lazy controls"
            git push origin HEAD:feat/news-controls
          fi
