name: Format pointer drag
on:
  push:
    branches: [feat/country-focus-news]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
          npx prettier --write src/features/map/components/MenaGlobe.tsx src/features/map/components/MenaGlobe.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/map/components/MenaGlobe.tsx src/features/map/components/MenaGlobe.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format drag interactions"
            git push origin HEAD:feat/country-focus-news
          fi
