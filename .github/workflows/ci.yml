name: Verify SIGNAL

on:
  push:
    branches: [main, integration/pr21-globe-verify]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade npm dependency resolver
        run: npm install --global npm@11.6.3
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Inspect map formatting
        run: |
          npx prettier --write src/features/map/components/MenaGlobe.css src/features/map/components/MenaGlobe.tsx
          git diff -- src/features/map/components/MenaGlobe.css src/features/map/components/MenaGlobe.tsx
      - name: Typecheck, lint, format, tests, build
        run: npm run check

  windows:
    name: Windows Rust and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Upgrade npm dependency resolver
        run: npm install --global npm@11.6.3
      - name: Install frontend dependencies
        run: npm ci --no-audit
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run build:desktop
      - name: Preserve installer
        uses: actions/upload-artifact@v4
        with:
          name: signal-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
