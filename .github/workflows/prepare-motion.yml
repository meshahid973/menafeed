name: Prepare motion branch
on:
  push:
    branches: [feat/motion-foundation]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and lock
        run: |
          npm install --global npm@11.6.3
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --no-audit
      - name: Format
        run: npx prettier --write src/components/layout/AppShell.tsx src/components/layout/AppShell.css src/components/layout/Sidebar.tsx src/components/layout/SettingsDialog.tsx src/components/layout/SettingsDialog.css src/features/news/ArticleReader.tsx src/features/news/NewsFeed.tsx src/app/App.tsx src/app/styles/tokens.css package.json
      - name: Commit lock and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock motion dependencies"
            git push origin HEAD:feat/motion-foundation
          fi
