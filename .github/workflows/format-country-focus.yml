name: Format country focus
on:
  push:
    branches: [feat/country-focus-news]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          npx prettier --write src/features/news/NewsFeed.test.tsx src/features/news/NewsFeed.tsx src/features/news/NewsFeed.css src/features/map/components/MenaGlobe.tsx src/features/map/components/MenaGlobe.test.tsx src/features/map/geography.ts src/features/map/geography.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "style: format country focus and relevance"
            git push origin HEAD:feat/country-focus-news
          fi
