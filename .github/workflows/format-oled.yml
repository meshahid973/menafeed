name: Format OLED workspace

on:
  push:
    branches: [feat/oled-workspace]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install --global npm@11.6.3
          npm ci --no-audit
      - name: Format
        run: |
          npx prettier --write src/components/layout/AppShell.tsx src/components/layout/AppShell.css src/components/layout/Sidebar.tsx src/components/layout/Sidebar.css src/components/layout/MapSlot.tsx src/components/layout/MapSlot.css src/components/layout/workspaceTypes.ts src/app/styles/tokens.css src/app/App.test.tsx src/features/news/NewsFeed.tsx src/features/news/NewsFeed.css src/features/news/StoryCard.tsx src/features/news/ArticleReader.tsx src/features/news/useBookmarks.ts src/features/news/NewsFeed.test.tsx src/features/news/useBookmarks.test.tsx index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html
          if ! git diff --cached --quiet; then
            git commit -m "style: format OLED workspace"
            git push origin HEAD:feat/oled-workspace
          fi
