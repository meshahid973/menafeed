name: Format controls
on:
  push:
    branches: [feat/news-controls]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install -g npm@11.6.3
          npm ci --no-audit
      - name: Format Phase 1
        run: npx prettier --write src/components/layout/AppShell.tsx src/components/layout/AppShell.css src/components/layout/Sidebar.tsx src/features/news/NewsFeed.tsx src/features/news/NewsFeed.css src/features/news/NewsFeed.test.tsx src/app/styles/arc-theme.css src/main.tsx package.json tsconfig.json vite.config.ts components.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "style: format Arc controls"
            git push origin HEAD:feat/news-controls
          fi
