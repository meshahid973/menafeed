name: Prepare workspace

on:
  push:
    branches: [feat/map-workspace]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          npm install --global npm@11.6.3
          npm install --package-lock-only --no-audit --ignore-scripts
          npm ci --no-audit
      - name: Format
        run: |
          npx prettier --write src/components/layout/AppShell.tsx src/components/layout/AppShell.css src/components/layout/MapSlot.tsx src/components/layout/MapSlot.css src/components/layout/Sidebar.tsx src/components/layout/WorkspaceSplit.tsx src/components/layout/WorkspaceSplit.css src/components/layout/WorkspaceSplit.test.tsx src/features/news/NewsFeed.tsx src/features/news/NewsFeed.css src/features/news/NewsFeed.test.tsx src/features/news/StoryCard.tsx src/features/news/ArticleReader.tsx src/features/map/components/MenaGlobe.tsx src/app/App.test.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock icons and format UI"
            git push origin HEAD:feat/map-workspace
          fi
